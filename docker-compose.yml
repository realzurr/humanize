# =============================================================================
# Humaniza Acadêmico — ambiente LOCAL de desenvolvimento.
#
# Este compose file SÓ sobe serviços na máquina local. Nenhum serviço é
# publicado em servidor externo sem autorização expressa.
#
#   docker compose up -d db          # apenas o banco
#   docker compose --profile app up  # banco + API + frontend
#   BACKEND_EXTRAS=redis RATE_LIMIT_BACKEND=redis \
#     docker compose --profile app --profile redis up --build
#                                    # + Redis para rate limit multi-nó
#
# Para desenvolvimento, prefira rodar o backend direto com `uvicorn`
# (ver README) — o compose é para testar a topologia completa.
# =============================================================================

name: humaniza-academico

services:
  db:
    image: postgres:16-alpine
    container_name: humaniza-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-humaniza}
      POSTGRES_USER: ${POSTGRES_USER:-humaniza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humaniza_local_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposto apenas em loopback.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-humaniza} -d ${POSTGRES_DB:-humaniza}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        EXTRAS: ${BACKEND_EXTRAS:-}
    container_name: humaniza-api
    profiles: ["app"]
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-humaniza}:${POSTGRES_PASSWORD:-humaniza_local_dev}@db:5432/${POSTGRES_DB:-humaniza}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
      - ./templates:/templates:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # O renderizador de PDF (LibreOffice) é opcional; sem ele, apenas
    # DOCX/TXT/Markdown são gerados e a limitação é declarada.
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: humaniza-redis
    # Opcional: só sobe com `--profile redis` (RATE_LIMIT_BACKEND=redis).
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # Exposto apenas em loopback.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: humaniza-web
    profiles: ["app"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
