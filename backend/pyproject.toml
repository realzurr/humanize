[project]
name = "humaniza-academico"
version = "0.1.0"
description = "Plataforma de normalização textual, humanização semântica e formatação acadêmica ABNT"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Renato Lemes Peixoto (realzurr)" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-docx>=1.1.2",
    "docxtpl>=0.17",
    "pyyaml>=6.0",
    "bibtexparser>=1.4",
    "structlog>=24.4",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
    "fakeredis[lua]>=2.26",
]
pdf = ["weasyprint>=62.3", "pymupdf>=1.24"]
redis = ["redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # flake8-simplify
    "ANN", # annotations
    "ASYNC",
    "S",   # bandit
    "RUF",
]
ignore = [
    "ANN401",  # Any permitido em schemas de API
    "S101",    # assert permitido em testes
    "B008",    # Depends() em FastAPI
    # RUF001/002/003: o projeto trata deliberadamente de caracteres Unicode
    # "ambíguos" (largura variável, sinais matemáticos, dashes). Sinalizar
    # esses caracteres no código-fonte geraria ruído sem valor.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S105", "S106", "S107"]
"app/core/config.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]

[[tool.mypy.overrides]]
module = ["bibtexparser.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "integration: testes que tocam banco, disco ou rede",
    "slow: testes demorados",
]
